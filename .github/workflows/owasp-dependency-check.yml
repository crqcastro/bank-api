name: OWASP Dependency-Check

on:
  push:
    branches: [master, main]
    paths:
      - 'pom.xml'
  pull_request:
    paths:
      - 'pom.xml'
  schedule:
    - cron: '0 3 * * 1'  # toda segunda-feira às 03:00 UTC
  workflow_dispatch:

jobs:
  owasp:
    name: Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B verify -Powasp -DskipTests

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/dependency-check-report/
          retention-days: 30

      - name: Publish OWASP summary
        if: always()
        run: |
          REPORT=target/dependency-check-report/dependency-check-report.html
          if [ -f "$REPORT" ]; then
            echo '## OWASP Dependency-Check' >> $GITHUB_STEP_SUMMARY
            echo 'Report gerado. Baixe o artefato **owasp-report** para ver o HTML completo.' >> $GITHUB_STEP_SUMMARY
          fi
